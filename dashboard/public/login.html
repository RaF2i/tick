<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e15">
<title>Login — Ticket Control</title>
<link rel="icon" href="/tick.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <span class="brand-mark login-mark"><img src="/tick.svg" alt="Ticket Control logo"></span>
    <h1>Ticket Control</h1>
    <p class="muted-text">Enter the dashboard password to continue.</p>
    <label><span>Password</span>
      <span class="pass-field">
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
        <button id="loginEye" class="pass-eye" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </span>
    </label>
    <p class="dialog-error hidden" id="loginError"></p>
    <button id="loginBtn" class="button button-primary" type="submit">Unlock</button>
  </form>
</div>
<script>
const form = document.querySelector('#loginForm');
const pass = document.querySelector('#loginPass');
const eye = document.querySelector('#loginEye');
const btn = document.querySelector('#loginBtn');
const err = document.querySelector('#loginError');
pass.focus();
// Eye toggle: swaps the field between masked and plain text, keeping the caret
// and the focus where the user left them.
const EYE_OPEN = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function setVisible(on) {
  pass.type = on ? 'text' : 'password';
  eye.innerHTML = on ? EYE_OFF : EYE_OPEN;
  eye.setAttribute('aria-pressed', String(on));
  const label = on ? 'Hide password' : 'Show password';
  eye.setAttribute('aria-label', label);
  eye.title = label;
  const at = pass.value.length;
  pass.focus();
  try { pass.setSelectionRange(at, at); } catch { /* ignore */ }
}
eye.addEventListener('click', () => setVisible(pass.type === 'password'));
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass.value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    pass.select();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
});
</script>
</body>
</html>
